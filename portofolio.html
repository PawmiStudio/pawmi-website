<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Pawmi Studio</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,600,700,900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Chillax', 'sans-serif'], },
                    colors: {
                        pawmi: { cokelat: '#9E7B54', cokelatTua: '#4A3723', kuning: '#F8E8A5', kuningTegas: '#F2D34D', bg: '#FEFCF7', }
                    },
                    boxShadow: {
                        'neo-sm': '2px 2px 0px 0px #4A3723',
                        'neo-md': '4px 4px 0px 0px #4A3723',
                        'neo-lg': '8px 8px 0px 0px #4A3723',
                        'neo-white': '4px 4px 0px 0px #FEFCF7',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FEFCF7; color: #4A3723; overflow-x: hidden; }
        .btn-neo { transition: all 0.15s ease-in-out; }
        .btn-neo:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px 0px #4A3723; }
        .btn-neo:active { transform: translate(4px, 4px); box-shadow: none; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="antialiased selection:bg-pawmi-kuning selection:text-pawmi-cokelatTua">

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) { window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; }); }
            });
        }
    </script>

    <!-- HEADER -->
    <header class="sticky top-0 z-50 w-full bg-pawmi-bg/90 backdrop-blur-md border-b-2 border-pawmi-cokelatTua">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">
                <a href="index.html" class="flex-shrink-0 flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <span class="text-2xl font-black text-pawmi-cokelat tracking-tight">Pawmi<span class="text-pawmi-kuningTegas drop-shadow-md">.</span></span>
                </a>
                <nav class="hidden md:flex gap-8 font-bold text-pawmi-cokelatTua text-sm lg:text-base">
                    <a href="index.html" class="hover:text-pawmi-cokelat transition-colors">Home</a>
                    <a href="animasi-ai.html" class="hover:text-pawmi-cokelat transition-colors">Animasi AI</a>
                    <a href="video-ads.html" class="hover:text-pawmi-cokelat transition-colors">Video Ads & Sosmed</a>
                    <a href="portofolio.html" class="text-pawmi-cokelat transition-colors border-b-2 border-pawmi-cokelat">Portofolio</a>
                </nav>
                <div class="hidden sm:flex">
                    <a href="https://wa.me/6283171603841?text=Halo%20Admin%20Pawmi%20Studio,%20saya%20mau%20konsultasi%20bikin%20video%20dong." class="bg-white border-2 border-pawmi-cokelatTua shadow-neo-sm rounded-full px-6 py-2.5 text-sm font-bold text-pawmi-cokelatTua btn-neo">Tanya Admin</a>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="relative w-full bg-pawmi-bg pt-16 pb-12 overflow-hidden border-b-2 border-pawmi-cokelatTua">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#9E7B5415_1px,transparent_1px),linear-gradient(to_bottom,#9E7B5415_1px,transparent_1px)] bg-[size:36px_36px] -z-10"></div>
        <div class="max-w-4xl mx-auto px-4 relative z-10 text-center flex flex-col items-center">
            <h1 class="text-5xl sm:text-6xl md:text-[72px] font-black text-pawmi-cokelatTua leading-[1.1] tracking-tight mb-6">
                Karya Terbaik <br>
                <span class="inline-block bg-pawmi-kuningTegas text-pawmi-cokelatTua px-6 py-2 mt-2 border-2 border-pawmi-cokelatTua shadow-neo-md transform rotate-1">Pawmi Studio</span>
            </h1>
            <p class="text-lg text-pawmi-cokelatTua/80 font-bold max-w-2xl">Buktikan sendiri kualitas video animasi AI dan video Ads yang udah kita kerjakan.</p>
        </div>
    </section>

    <!-- GALERI UTAMA -->
    <section class="w-full py-16 bg-pawmi-bg min-h-screen">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Filter Buttons -->
            <div class="flex flex-wrap justify-center gap-3 mb-12">
                <button class="filter-btn active-filter bg-pawmi-kuningTegas border-2 border-pawmi-cokelatTua shadow-neo-sm rounded-full px-6 py-2.5 font-bold text-pawmi-cokelatTua transition-all hover:-translate-y-1" data-filter="all">🎛️ Semua</button>
                <button class="filter-btn bg-white border-2 border-pawmi-cokelatTua shadow-neo-sm rounded-full px-6 py-2.5 font-bold text-pawmi-cokelatTua transition-all hover:-translate-y-1" data-filter="animasi">🎨 Animasi 2D</button>
                <button class="filter-btn bg-white border-2 border-pawmi-cokelatTua shadow-neo-sm rounded-full px-6 py-2.5 font-bold text-pawmi-cokelatTua transition-all hover:-translate-y-1" data-filter="3d">🧊 3D Design</button>
                <button class="filter-btn bg-white border-2 border-pawmi-cokelatTua shadow-neo-sm rounded-full px-6 py-2.5 font-bold text-pawmi-cokelatTua transition-all hover:-translate-y-1" data-filter="ads">🎬 Video Ads</button>
                <button class="filter-btn bg-white border-2 border-pawmi-cokelatTua shadow-neo-sm rounded-full px-6 py-2.5 font-bold text-pawmi-cokelatTua transition-all hover:-translate-y-1" data-filter="sosmed">📱 Konten Sosmed</button>
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="portfolio-grid">
                <div class="col-span-full text-center py-12">
                    <p class="font-bold text-pawmi-cokelatTua/60 text-lg">Memuat portofolio dari database...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-pawmi-cokelatTua pt-16 pb-8 border-t-2 border-pawmi-bg/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-pawmi-bg/60">
            <p>© 2026 Pawmi Studio. All rights reserved.</p>
        </div>
    </footer>

    <!-- SKRIP UTAMA PEMBUAT KARTU OTOMATIS & PEMBERSIH LINK YOUTUBE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('portfolio-grid');

            fetch('/data-portofolio.json')
                .then(response => response.json())
                .then(data => {
                    if (data.videos && data.videos.length > 0) {
                        let htmlContent = '';
                        
                        data.videos.forEach(video => {
                            let badgeBg = 'bg-pawmi-kuning';
                            let badgeText = 'Portofolio';
                            let aspectClass = 'aspect-video'; 

                            if(video.kategori === 'animasi') { badgeBg = 'bg-pawmi-kuning'; badgeText = 'Animasi 2D'; aspectClass = 'aspect-video'; }
                            else if(video.kategori === 'ads') { badgeBg = 'bg-[#FFB5A7]'; badgeText = 'Video Ads'; aspectClass = 'aspect-[9/16]'; }
                            else if(video.kategori === '3d') { badgeBg = 'bg-[#A7E4FF]'; badgeText = '3D Design'; aspectClass = 'aspect-video'; }
                            else if(video.kategori === 'sosmed') { badgeBg = 'bg-[#E8DDFB]'; badgeText = 'Konten Sosmed'; aspectClass = 'aspect-[9/16]'; }

                            // PEMBERSIH OTOMATIS: Kalau lu tak sengaja paste full link, skrip ini otomatis mengambil ID-nya saja!
                            let rawId = video.youtube_id ? video.youtube_id.trim() : '';
                            let cleanId = rawId;
                            if (rawId.includes('youtu.be/')) {
                                cleanId = rawId.split('youtu.be/')[1].split('?')[0];
                            } else if (rawId.includes('watch?v=')) {
                                cleanId = rawId.split('watch?v=')[1].split('&')[0];
                            }

                            const thumbUrl = `https://img.youtube.com/vi/${cleanId}/maxresdefault.jpg`;
                            const watchUrl = `https://www.youtube.com/watch?v=${cleanId}`;

                            htmlContent += `
                            <a href="${watchUrl}" target="_blank" class="portfolio-item group relative rounded-[2rem] border-4 border-pawmi-cokelatTua bg-white overflow-hidden shadow-neo-md hover:-translate-y-2 transition-all duration-300 block" data-category="${video.kategori}">
                                <div class="relative ${aspectClass} bg-gray-200 flex items-center justify-center overflow-hidden border-b-4 border-pawmi-cokelatTua">
                                    <img src="${thumbUrl}" alt="${video.title}" class="w-full h-full object-cover" onerror="this.src='https://img.youtube.com/vi/${cleanId}/hqdefault.jpg'">
                                    <div class="absolute inset-0 bg-pawmi-cokelatTua/40 backdrop-blur-sm opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all duration-300 z-10">
                                        <div class="w-16 h-16 bg-pawmi-kuningTegas rounded-full border-4 border-pawmi-cokelatTua flex items-center justify-center shadow-neo-sm transform scale-50 group-hover:scale-100 transition-transform duration-300 delay-100">
                                            <svg class="w-8 h-8 text-pawmi-cokelatTua ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                        </div>
                                    </div>
                                </div>
                                <div class="p-6">
                                    <span class="inline-block ${badgeBg} px-3 py-1 rounded-md border-2 border-pawmi-cokelatTua text-xs font-black uppercase mb-3">${badgeText}</span>
                                    <h4 class="font-black text-pawmi-cokelatTua text-xl leading-tight">${video.title}</h4>
                                </div>
                            </a>
                            `;
                        });
                        grid.innerHTML = htmlContent;
                    } else {
                        grid.innerHTML = `<div class="col-span-full text-center py-12"><p class="font-bold text-pawmi-cokelatTua/60">Belum ada portofolio yang dipublikasikan dari Admin.</p></div>`;
                    }
                })
                .catch(error => {
                    grid.innerHTML = `<div class="col-span-full text-center py-12"><p class="font-bold text-red-600">Gagal memuat data portofolio.</p></div>`;
                });

            // Sistem Filter Kategori
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => { b.classList.remove('bg-pawmi-kuningTegas'); b.classList.add('bg-white'); });
                    btn.classList.remove('bg-white'); btn.classList.add('bg-pawmi-kuningTegas');

                    const filterValue = btn.getAttribute('data-filter');
                    setTimeout(() => {
                        const portfolioItems = document.querySelectorAll('.portfolio-item');
                        portfolioItems.forEach(item => {
                            item.classList.remove('fade-in');
                            if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                                item.style.display = 'block';
                                void item.offsetWidth;
                                item.classList.add('fade-in');
                            } else {
                                item.style.display = 'none';
                            }
                        });
                    }, 50);
                });
            });
        });
    </script>
</body>
</html>
