backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "data_web"
    label: "Database Website"
    files:
      - label: "Karya Portofolio"
        name: "portofolio"
        file: "data-portofolio.json"
        fields:
          - label: "Daftar Video Portofolio"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Judul Video", name: "title", widget: "string"}
              - {label: "Kategori", name: "kategori", widget: "select", options: ["animasi", "3d", "ads", "sosmed"]}
              - {label: "ID Video YouTube (Contoh: dQw4w9WgXcQ)", name: "youtube_id", widget: "string"}

      - label: "Edit Halaman Video Ads"
        name: "page_video_ads"
        file: "data-video-ads.json"
        fields:
          - {label: "Info: Bagian ini untuk mengganti teks dan gambar di video-ads.html", name: "info", widget: "hidden", default: "info"}
          - {label: "Headline Utama", name: "hero_headline", widget: "string", default: "Pengen Bikin Video Iklan & Konten Profesional Tapi Budget Terbatas?"}
          - {label: "Gambar Mascot Bawah (Ganti tulisan Placeholder)", name: "mascot_image", widget: "image", required: false}
